services:
  - type: web
    name: lexflowai-backend
    env: python
    plan: free
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port 10000
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: lexflowai-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: EMBED_MODEL
        value: sentence-transformers/all-MiniLM-L6-v2
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_ENVIRONMENT
        sync: false
      - key: PINECONE_INDEX_NAME
        value: lexflowai-index
      - key: JWT_SECRET
        generateValue: true
    autoDeploy: true

  - type: web
    name: lexflowai-frontend
    env: node
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    startCommand: cd frontend && npm start
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        value: https://lexflowai-backend.onrender.com
    autoDeploy: true

databases:
  - name: lexflowai-db
    plan: free
